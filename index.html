<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SYSTEM LOCKED</title>
<style>
body{margin:0;background:black;color:white;font-family:sans-serif;text-align:center;animation:flash 0.8s infinite}

h1{font-size:32px;color:red;text-shadow:0 0 20px red;margin-top:20px}
#timer{font-size:45px;color:yellow;font-weight:900}
.box{background:#111;border:2px solid red;padding:15px;margin:15px;border-radius:15px}
#logs{font-family:monospace;color:#00ff00;font-size:13px;text-align:left;height:120px;overflow:hidden;background:#000;padding:10px;border:1px solid #00ff00;margin:15px}
#prank{display:none;padding:30px}
button{padding:13px 22px;border:none;border-radius:25px;background:gold;color:black;font-weight:bold;font-size:17px}
</style>
</head>
<body onclick="if(navigator.vibrate) navigator.vibrate(200)">

<div id="lock">
  <h1>🔒 PHONE LOCK HO GAYA 🔒</h1>
  <p>LIGER NE TUMHARA PHONE LOCK KAR DIYA</p>
  <div id="timer">10:00</div>
  <div class="box">
    <p>⚠️ BACK MAT JAO ⚠️</p>
    <p>Phone 10 minute tak yahin rahega...</p>
  </div>
  <div id="logs">> Hacking Start...</div>
  <p style="font-size:11px;color:#888;">POWERED BY LIGER - SCREEN PE DABAO</p>
</div>

<div id="prank">

  <p style="font-size:20px;">Darr gaye na?<br>Tumhara phone bilkul safe hai!</p>
  <p style="font-size:35px;">🦁 LIGER IS KING 🦁</p>
  <button onclick="location.reload()">DOBARA PRANK KARO</button>
  <p style="font-size:12px;margin-top:15px;">Is link ko dost ko bhejo!</p>
</div>

<script>
let sec=600;
setInterval(()=>{
  sec--; if(sec<0) sec=0;
  let m=Math.floor(sec/60); let s=sec%60;
  document.getElementById('timer').innerText=m+":"+(s<10?"0"+s:s);
},1000);

let lines=["> WhatsApp Hacking... DONE","> Gallery Hacking... DONE","> Contacts Chura Liye...","> Location Track Ho Rahi Hai...","> LIGER Tumhe Dekh Raha Hai 👀","> Password Mil Gaya..."];
let i=0;
setInterval(()=>{
  document.getElementById('logs').innerHTML+="<br>"+lines[i%lines.length];
  i++;
},1500);

setTimeout(()=>{
  document.getElementById('lock').style.display='none';
  document.getElementById('prank').style.display='block';
  document.body.style.animation='none';
  document.body.style.background='black';
},12000);
</script>
</body>
</html>
